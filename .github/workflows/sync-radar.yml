name: Sync Tibo Radar & Upstream Resets

on:
  schedule:
    # Run every 5 minutes for ultra-fast real-time tracking
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      tweet_text:
        description: "Manually inject a Tibo tweet text"
        required: false
        type: string
      tweet_url:
        description: "Direct URL to Tibo's tweet"
        required: false
        type: string
      tweet_type:
        description: "Reset type (regular or banked)"
        required: false
        default: "regular"
        type: choice
        options:
          - regular
          - banked

permissions:
  contents: write

jobs:
  sync-tibo:
    name: Sync Tibo Signal & Codex Resets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tibo Radar Sync
        run: |
          if [ -n "${{ github.event.inputs.tweet_text }}" ]; then
            node scripts/sync-tibo.mjs --add-tweet "${{ github.event.inputs.tweet_text }}" --url "${{ github.event.inputs.tweet_url }}" --type "${{ github.event.inputs.tweet_type }}"
          else
            node scripts/sync-tibo.mjs
          fi

      - name: Check for data changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain src/data/fallback-resets.json src/data/fallback-scheduled.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fallback-resets.json src/data/fallback-scheduled.json
          git commit -m "chore(data): auto sync Tibo signals & upstream resets [skip ci]"
          git push
