name: Radar Data Pipeline

# One writer, one schedule.
#
# There used to be two workflows writing the same dataset on different
# schedules (`*/5` here and `0 */4` in sync-upstream.yml), so the 4-hourly job
# could clobber whatever the 5-minute job had just produced. That second
# workflow is gone; this one is the single entry point.
#
# The pipeline is now split by intent:
#   • check-data-health.mjs — read-only gate. Goes RED when the dataset is
#     malformed, unattributed, stale, or when upstream fails for a reason we
#     can act on. This is the alarm that the old scripts lacked: they exited 0
#     on failure, so a dead pipeline looked exactly like a quiet one.
#
#     One exception, learned the hard way on 2026-09-15: upstream sits behind
#     Cloudflare, which answers datacenter egress with a JS challenge
#     (HTTP 403 + `cf-mitigated: challenge`). GitHub Actions and Vercel are
#     both challenged, regardless of User-Agent. That is an environment
#     condition CI cannot fix, so it is reported as a WARNING and exit code 4
#     rather than a red build every five minutes — otherwise every later step
#     here (cross-check, probe, notify) would be skipped and the pipeline would
#     fail to detect anything at all. Live probing needs a non-datacenter
#     egress; a local scheduler is not challenged.
#   • sync-upstream.mjs     — read-only cross-check. Reports divergences,
#     never writes.
#   • sync-tibo.mjs --probe — read-only. Reports records upstream knows that
#     we do not, and exits 3 so this workflow can raise a confirmation.
#   • notify-feishu.mjs     — delivers the confirmation request over Feishu,
#     with a one-click link. Deliberately NOT routed through the site: if
#     whenreset.top is down, the person still has to be reachable. Can post
#     into a group bot or straight to one person through a self-built app.
#   • sync-tibo.mjs --add-tweet — the ONLY write path, and it only runs on a
#     manual dispatch or a confirmed one-click link. Upstream never writes.

on:
  schedule:
    # Every 5 minutes: fast enough to open a confirmation issue promptly.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      feishu_self_test:
        description: "Send a Feishu self-test message to prove the notification channel works (writes nothing)"
        required: false
        type: boolean
        default: false
      tweet_text:
        description: "Confirmed announcement text (enables the ingest path)"
        required: false
        type: string
      tweet_url:
        description: "Direct URL to the announcement"
        required: false
        type: string
      tweet_at:
        description: "announced_at, ISO 8601 (defaults to now)"
        required: false
        type: string
      tweet_type:
        description: "Reset type"
        required: false
        default: "regular"
        type: choice
        options:
          - regular
          - banked
      tweet_id:
        description: "Record id (must match the record being confirmed)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Health gate, cross-check and probe
    runs-on: ubuntu-latest
    env:
      # Secrets are lifted into env at job level because a step-level `if:`
      # cannot reference `secrets.*` directly — and the notification step has to
      # be skippable without turning the run red when the channel is unset.
      #
      # Two Feishu channels are supported and notify-feishu.mjs picks between
      # them: a custom group bot (URL + optional signing secret) or a
      # self-built app (App ID/Secret + recipient). Configure one of them —
      # an app that can reach a person directly, rather than a group. A
      # half-configured app is reported by the script, not silently downgraded.
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
      FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
      CONFIRM_SECRET: ${{ secrets.CONFIRM_SECRET }}
      SITE_URL: ${{ vars.SITE_URL || 'https://whenreset.top' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs before the health gate on purpose: whether the notification
      # credentials work is independent of whether the dataset is healthy, and
      # a self-test is exactly what you reach for when something is wrong.
      # It sends a fixed message with no confirm link, so it cannot write.
      - name: Feishu channel self-test (dispatched only, writes nothing)
        if: github.event.inputs.feishu_self_test == 'true'
        run: node scripts/notify-feishu.mjs --self-test

      - name: Data health gate (read-only, fails the run when unhealthy)
        id: health
        run: |
          set +e
          node scripts/check-data-health.mjs
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = healthy. 4 = upstream answered with a Cloudflare edge challenge:
          # the dataset passed every check, CI just cannot see the API. Anything
          # else is a real problem.
          if [ "$code" = "4" ]; then
            echo "::warning::Upstream is blocked by a Cloudflare edge challenge from CI (exit 4). Dataset is healthy; live probing needs a non-datacenter egress."
            exit 0
          fi
          exit "$code"

      - name: Cross-check upstream (read-only)
        id: crosscheck
        run: |
          set +e
          node scripts/sync-upstream.mjs
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "4" ]; then
            echo "::warning::Cross-check skipped: upstream blocked by a Cloudflare edge challenge (exit 4)."
            exit 0
          fi
          exit "$code"

      - name: Probe for records awaiting confirmation
        id: probe
        run: |
          set +e
          # --json keeps stdout as exactly one JSON document (written to
          # probe.json for the notifier) while every human-readable line goes to
          # stderr (written to probe.log for the issue body).
          node scripts/sync-tibo.mjs --probe --json > probe.json 2> probe.log
          code=$?
          set -e
          cat probe.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = nothing pending, 3 = pending confirmation: both healthy.
          # 4 = upstream blocked by a Cloudflare edge challenge: not detectable
          # from CI, but also not a failure.
          # Anything else (1 = fatal, upstream unreachable) must fail the run.
          if [ "$code" != "0" ] && [ "$code" != "3" ] && [ "$code" != "4" ]; then
            echo "::error::Probe failed with exit code $code (upstream unreachable or dataset unreadable)"
            exit 1
          fi
          if [ "$code" = "4" ]; then
            echo "::warning::Probe degraded: upstream blocked by a Cloudflare edge challenge (exit 4). No claim is made about pending records."
          fi

      - name: Raise, refresh or close the confirmation issue
        id: confirm
        if: steps.probe.outputs.exit_code == '3' || steps.probe.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[Needs confirmation] Upstream reports reset records missing locally"
          # The open issue doubles as the deduplication ledger. Without it the
          # 5-minute schedule would re-notify the same pending record 288 times
          # a day. A machine-readable marker in the body records which ids have
          # already been announced; anything newer than that gets pushed again.
          EXISTING=$(gh issue list --state open --limit 50 --json number,title \
            --jq '[.[] | select(.title | startswith("[Needs confirmation]"))][0].number // ""')

          if [ "${{ steps.probe.outputs.exit_code }}" = "0" ]; then
            # Nothing awaits confirmation any more — usually because it was
            # confirmed and ingested. Leaving a stale "needs confirmation"
            # issue open trains people to ignore the next one.
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "Every reported record is now in the dataset. Closing this issue."
              gh issue close "$EXISTING"
              echo "Closed stale confirmation issue #$EXISTING."
            fi
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KNOWN=""
          if [ -n "$EXISTING" ]; then
            KNOWN=$(gh issue view "$EXISTING" --json body --jq '.body' \
              | sed -n 's/.*pending-ids: \([^>]*\)-->.*/\1/p' | head -1 | tr -d ' ' || true)
          fi

          IDS=$(node -e 'const p=require("./probe.json");console.log((p.records||[]).map(r=>r.id).join(","))')
          NOTIFY=$(KNOWN="$KNOWN" IDS="$IDS" node -e '
            const known = new Set((process.env.KNOWN || "").split(",").filter(Boolean));
            const ids = (process.env.IDS || "").split(",").filter(Boolean);
            console.log(ids.filter((id) => !known.has(id)).length);
          ')

          {
            echo "The upstream API reports records this repository does not have yet."
            echo
            echo "**Nothing was written.** Upstream may suggest that something may have happened;"
            echo "it may not decide that it did. Confirm a record, then ingest it deliberately."
            echo
            echo '```'
            cat probe.log
            echo '```'
            echo
            echo "## How to confirm"
            echo "The fastest route is the **Feishu notification**, which links to a page that"
            echo "ingests the record on one click — no GitHub login required."
            echo
            echo "Without Feishu configured, run the **Radar Data Pipeline** workflow manually"
            echo "(Actions → Run workflow) with \`tweet_text\`, \`tweet_url\`, \`tweet_at\` and"
            echo "\`tweet_type\` filled in."
            echo
            echo "If the report is wrong, just close this issue."
            echo
            echo "## Why this is not automatic"
            echo "Handing the write path to upstream means one unilateral edit on their side"
            echo "enters git history and shifts every historical statistic derived from it,"
            echo "with no clean way back. Delay is acceptable here; a wrong fact is not."
            echo
            echo "<!-- pending-ids: $IDS -->"
          } > issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file issue-body.md
            echo "Refreshed issue #$EXISTING."
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi

          echo "notify=$([ "$NOTIFY" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "New since last notification: $NOTIFY"

      - name: Notify Feishu
        if: steps.probe.outputs.exit_code == '3' && steps.confirm.outputs.notify == 'true'
        run: |
          # Either channel is enough to proceed. A half-configured app is the
          # script's problem to report, not this guard's — so the guard only
          # asks whether anything at all was configured.
          if [ -z "$FEISHU_WEBHOOK_URL" ] && [ -z "$FEISHU_APP_ID" ]; then
            echo "No Feishu channel configured (neither FEISHU_WEBHOOK_URL nor FEISHU_APP_ID)."
            echo "The confirmation issue above is the fallback — nothing is lost."
            exit 0
          fi
          node scripts/notify-feishu.mjs probe.json

      - name: Ingest human-confirmed record
        if: github.event.inputs.tweet_text != ''
        run: |
          node scripts/sync-tibo.mjs \
            --add-tweet "${{ github.event.inputs.tweet_text }}" \
            --url "${{ github.event.inputs.tweet_url }}" \
            --at "${{ github.event.inputs.tweet_at }}" \
            --id "${{ github.event.inputs.tweet_id }}" \
            --type "${{ github.event.inputs.tweet_type }}"

      - name: Commit confirmed data changes
        run: |
          if [ -z "$(git status --porcelain src/data/)" ]; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore(data): ingest human-confirmed reset record [skip ci]"
          git push
