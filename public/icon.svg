<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Telemetry Live Pulse Indicator (top right) -->
  <circle cx="24.5" cy="7.5" r="2" fill="#10B981" filter="url(#glow)"/>
  <circle cx="24.5" cy="7.5" r="1" fill="#A7F3D0"/>

  <!-- Terminal prompt chevron (>) -->
  <path d="M 8 11 L 14 16 L 8 21" fill="none" stroke="#10B981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal cursor (_) -->
  <line x1="16.5" y1="21" x2="23.5" y2="21" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
</svg>
